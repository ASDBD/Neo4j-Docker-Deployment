services:
  neo4j:
    image: neo4j:2026.10.1-community
    container_name: neo4j-lab
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Protocollo Bolt (driver)
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./import:/import:ro   # file CSV usati da LOAD CSV
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-laboratorio}
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  jupyter:
    build: ./jupyter
    container_name: jupyter-lab
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"   # solo locale (nessun token)
    volumes:
      - ./notebooks:/home/student/notebooks
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-laboratorio}
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
  neo4j-logs:
